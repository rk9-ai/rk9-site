# Example reverse-proxy vhost for the apex rk9.fi marketing site.
# Apply on the reverse-proxy host (sites-available + symlink), then:
#   sudo certbot --nginx -d rk9.fi -d www.rk9.fi   # issues + wires TLS
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prereq DNS: A/AAAA for rk9.fi and www.rk9.fi → the reverse-proxy public IP.
# LEAVE MX / SPF / DKIM / DMARC TXT records UNTOUCHED — email is independent.
# Prereq firewall: allow the proxy host → the container host on the app port.
# Set the upstream below to the container host:port (e.g. via your own infra config).

upstream rk9_site {
    server CONTAINER_HOST:3050;   # rk9-site container host:port
}

# www → apex redirect (+ HTTP → HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name rk9.fi www.rk9.fi;
    # certbot inserts its ACME challenge location here on first issuance.
    location / { return 301 https://rk9.fi$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rk9.fi;

    ssl_certificate     /etc/letsencrypt/live/rk9.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rk9.fi/privkey.pem;

    return 301 https://rk9.fi$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rk9.fi;

    ssl_certificate     /etc/letsencrypt/live/rk9.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rk9.fi/privkey.pem;

    # Security headers — static marketing site, no inline-eval needed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://rk9_site;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

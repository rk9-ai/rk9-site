# Inside-the-container nginx — serves the static Vite build.
# Public TLS + apex routing is handled upstream by nginx.rk9.fi.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for compose / wait-for-health.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # Vite fingerprinted assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: every route falls back to index.html (hash routing, but be safe).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached (so new deploys are picked up).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

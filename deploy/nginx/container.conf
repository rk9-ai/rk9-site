# Inside-the-container nginx — serves the static site (site/).
# Public TLS + apex routing is handled upstream by the reverse proxy.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for compose / wait-for-health.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # HTML must never be cached (so new deploys are picked up).
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /tietosuoja {
        add_header Cache-Control "no-cache";
        try_files /tietosuoja.html =404;
    }
    location = /tietosuoja.html {
        add_header Cache-Control "no-cache";
    }

    # The retired SPA lived here (fallback era, 2026-08-14..15).
    location = /classic {
        return 301 /;
    }

    # og.jpg and any other static extras: short cache.
    location / {
        expires 7d;
        try_files $uri $uri/ =404;
    }
}

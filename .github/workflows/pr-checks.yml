name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert site files
        run: |
          test -f site/index.html
          test -f site/tietosuoja.html
          test -f site/og.jpg
          grep -q 'id="stage"' site/index.html
          grep -q 'Tietosuojaseloste' site/tietosuoja.html
          grep -q 'og:image' site/index.html
